          style="

          >

    <script>
      const playerNameInput = document.getElementById("playername");
      const chosenCharSelect = document.getElementById("chosencharacter");
      const startButton = document.getElementById("startgame");
      const stopButton = document.getElementById("stopgame");
      const currentScoreSpan = document.getElementById("currentscore");
      const highestScoreElement = document.getElementById("highestscore");
      const characterCells = [
        document.getElementById("character1"),
        document.getElementById("character2"),
        document.getElementById("character3"),
      ];
      const possibleCharacters = ["B", "F", "$", "%", "3", "9"];

      let cScore = 0; /* Current score be 0*/
      let hScore = 0; /*current highest score be 0*/
      let winner = "";
      let gameRunning = false;
      let hScorer = false;
      let gameInterval;

      function enable() {
        const hasName = playerNameInput.value.trim() !== "";
        const disableControls = !hasName || gameRunning;
        chosenCharSelect.disabled = disableControls;
        startButton.disabled = disableControls;
        stopButton.disabled = true;
      }

      function resetGameDisplay() {
        cScore = 0;
        currentScoreSpan.textContent = "0";
        characterCells.forEach((td) => (td.textContent = ""));
        chosenCharSelect.disabled = false;
        startButton.disabled = false;
        stopButton.disabled = true;
        gameRunning = false;
      }

      function generateCharacters() {
        let selectedCharacters = [];
        while (selectedCharacters.length < 3) {
          const randomCharacter =
            possibleCharacters[
              Math.floor(Math.random() * possibleCharacters.length)
            ];
          if (!selectedCharacters.includes(randomCharacter)) {
            selectedCharacters.push(randomCharacter);
          }
        }
        return selectedCharacters;
      }

      function characterClicked(choice) {
        if (!gameRunning) return;

        const chosencharacter = chosenCharSelect.value;
        if (choice.textContent === chosencharacter) {
          cScore += 4;
        } else {
          cScore -= 3;
        }
        currentScoreSpan.textContent = cScore;
        currentScoreSpan.style.color = "red";
      }

      function updateCharacterDisplay(chars) {
        for (let index = 0; index < chars.length; index++) {
          const character = chars[index];
          const cell = characterCells[index];
          cell.textContent = character;
        }
      }
      
      function startGame() {
        if (gameRunning) return;

        chosenCharSelect.disabled = true;
        cScore = 0;
        currentScoreSpan.textContent = "0";
        gameRunning = true;
        startButton.disabled = true;
        stopButton.disabled = false;

        let newCharacters = generateCharacters();
        updateCharacterDisplay(newCharacters);

        gameInterval = setInterval(() => {
          newCharacters = generateCharacters();
          updateCharacterDisplay(newCharacters);
        }, 2000);
      }

      function stopGame() {
        if (!gameRunning) return;
        gameRunning = false;
        clearInterval(gameInterval);
        startButton.disabled = false;
        stopButton.disabled = true;
        chosenCharSelect.disabled = false;

        if (cScore > hScore) {
          hScore = cScore;
          hScorer = playerNameInput.value.trim();
          highestScoreElement.textContent = `Highest: ${hScore} ${hScorer}`;
        }
      }

      resetGameDisplay();
      enable();
    </script>
