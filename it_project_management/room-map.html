        <style>
            .map-page {
                padding: 28px 40px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .map-title {
                font-size: 1.6rem;
                font-weight: 800;
                color: #0b0b45;
                margin-bottom: 20px;
                width: fit-content;
            }

            /* ── Outer map container ── */
            .map-container {
                border: 1.5px solid #bbb;
                border-radius: 6px;
                display: inline-flex;
                flex-direction: column;
                padding: 16px;
                gap: 4px;
                background: #fff;
                position: relative;
            }

            /* Location pin top-left */
            .map-pin {
                position: absolute;
                top: 16px;
                left: 14px;
                color: #1a56a0;
            }

            /* ── Grid of 4 block quadrants ── */
            .map-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 4px;
                margin-left: 20px;
            }

            .map-block {
                border: 1.5px solid #bbb;
                border-radius: 4px;
                min-width: 260px;
                min-height: 160px;
                position: relative;  /* ← key */
                padding: 0;
            }

            .block-label {
                font-size: 1.1rem;
                font-weight: 800;
                color: #0b0b45;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
                z-index: 0;
            }

            /* ── Room icons scattered inside each block ── */
            .rooms-scatter {
                display: flex;
                flex-wrap: wrap;
                gap: 10px 14px;
                align-items: center;
            }

            .room-icon {
                position: absolute;   /* ← each icon placed by top/left */
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1px;
                cursor: pointer;
                transition: transform 0.15s;
                z-index: 1;
            }


            .room-icon:hover { transform: scale(1.2); }


            .room-icon span {
                font-size: 0.6rem;
                font-weight: 700;
                color: #333;
            }

            /* Shape styles */
            /* Triangle — 1 pax */
            .shape-triangle {
                width: 0;
                height: 0;
                border-left: 10px solid transparent;
                border-right: 10px solid transparent;
                border-bottom: 18px solid #0b0b45;
                position: relative;
            }

            .shape-triangle.outline {
                border-bottom-color: transparent;
                border: none;
                width: 20px;
                height: 18px;
                background: none;
            }

            /* Using SVG for cleaner shapes */
            .room-icon svg { display: block; }

            /* Circle — 2 pax */
            .shape-circle {
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: #4a6fa5;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #fff;
                font-size: 0.65rem;
                font-weight: 700;
            }

            /* Diamond — 4 pax */
            .shape-diamond {
                width: 16px;
                height: 16px;
                background: #2e9e72;
                transform: rotate(45deg);
            }

            .diamond-wrap {
                width: 22px;
                height: 22px;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            /* Square — 20 pax */
            .shape-square {
                width: 22px;
                height: 22px;
                border: 2px solid #4a6fa5;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0.65rem;
                font-weight: 700;
                color: #4a6fa5;
                background: #fff;
            }

            /* Coloured variants for Block C bottom */
            .shape-triangle--orange { color: #e07b30; }
            .shape-triangle--teal   { color: #2e9e72; }
            .shape-square--rose     { border-color: #c0665a; color: #c0665a; }
            .shape-square--green    { border-color: #3a8a4a; color: #3a8a4a; background: #3a8a4a; color: #fff; }

            /* ── Legend ── */
            .map-legend {
                display: flex;
                align-items: center;
                gap: 32px;
                margin-top: 16px;
                padding-left: 4px;
            }

            .legend-item {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 0.95rem;
                font-weight: 600;
                color: #111;
            }

            /* Dark mode */
            .dark-mode .map-title { color: #a0b4ff; }
            .dark-mode .map-container { background: #1e1e2e; border-color: #444; }
            .dark-mode .map-block { border-color: #444; }
            .dark-mode .block-label { color: #a0b4ff; }
            .dark-mode .room-icon span { color: #ccc; }
            .dark-mode .legend-item { color: #e0e0e0; }
            .dark-mode .shape-square { background: #1e1e2e; }
        </style>
