<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Room Detail - UOW Room Booking System</title>
        <link rel="stylesheet" href="./loggedin.css">
        <script>
            if (sessionStorage.getItem('uow_darkmode') === 'true') {
                document.documentElement.classList.add('dark-mode');
            }
        </script>
        <style>
            .detail-page {
                padding: 28px 40px;
                max-width: 900px;
            }

            .back-btn {
                display: flex;
                align-items: center;
                gap: 6px;
                background: none;
                border: none;
                font-size: 1rem;
                color: #333;
                cursor: pointer;
                margin-bottom: 20px;
                padding: 0;
            }
            .back-btn:hover { color: #0b0b45; }

            /* ── Two-column layout ── */
            .detail-layout {
                display: flex;
                gap: 48px;
                align-items: flex-start;
            }

            /* Left — room info */
            .detail-left {
                flex: 1;
                min-width: 0;
            }

            .detail-room-title {
                font-size: 1.5rem;
                font-weight: 800;
                color: #111;
                margin-bottom: 20px;
            }

            .detail-row {
                display: flex;
                align-items: flex-start;
                gap: 0;
                margin-bottom: 18px;
                font-size: 0.95rem;
                color: #111;
            }

            .detail-label {
                min-width: 130px;
                font-weight: 500;
                color: #111;
                flex-shrink: 0;
            }

            .detail-colon {
                margin-right: 12px;
                color: #111;
            }

            .detail-value {
                color: #111;
                font-weight: 400;
            }

            /* Equipment checkboxes */
            .equipment-list {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }

            .equipment-item {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 0.95rem;
                color: #111;
            }

            .equipment-item input[type="checkbox"] {
                width: 16px;
                height: 16px;
                pointer-events: none;
                accent-color: #0b0b45;
            }

            /* Time slots */
            .timeslot-wrap {
                display: flex;
                flex-wrap: wrap;
                gap: 10px;
                margin-top: 4px;
            }

            .timeslot-btn {
                padding: 8px 16px;
                border: 1.5px solid #aaa;
                border-radius: 6px;
                background: #fff;
                font-size: 0.9rem;
                font-weight: 600;
                color: #111;
                cursor: pointer;
                transition: all 0.15s;
            }

            .timeslot-btn:hover {
                border-color: #0b0b45;
                background: #f0f0f8;
            }

            .timeslot-btn.selected {
                background: #0b0b45;
                color: #fff;
                border-color: #0b0b45;
            }

            /* Price */
            .detail-price {
                font-size: 0.95rem;
                color: #111;
            }

            /* Right — calendar */
            .detail-right {
                flex-shrink: 0;
                width: 260px;
            }

            .cal-box {
                border: 1.5px solid #0b0b45;
                border-radius: 6px;
                overflow: hidden;
                background: #fff;
            }

            .cal-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: #0b0b45;
                color: #fff;
                padding: 10px 14px;
            }

            .cal-header span {
                font-size: 0.95rem;
                font-weight: 700;
            }

            .cal-nav {
                background: none;
                border: none;
                color: #fff;
                font-size: 1.1rem;
                cursor: pointer;
                padding: 0 4px;
                line-height: 1;
            }
            .cal-nav:hover { opacity: 0.7; }

            .cal-days-header {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                text-align: center;
                font-size: 0.75rem;
                font-weight: 700;
                color: #555;
                padding: 8px 6px 4px;
                background: #fff;
            }

            .cal-grid {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 2px;
                padding: 4px 6px 10px;
                background: #fff;
            }

            .cal-day {
                text-align: center;
                padding: 5px 2px;
                font-size: 0.8rem;
                color: #111;
                cursor: pointer;
                border-radius: 4px;
                transition: background 0.1s;
            }

            .cal-day:hover { background: #e8e8f0; }
            .cal-day.today { background: #e0e0f0; font-weight: 700; }
            .cal-day.selected { background: #0b0b45; color: #fff; border-radius: 4px; }
            .cal-day.empty { cursor: default; }
            .cal-day.empty:hover { background: none; }
            .cal-day.past { color: #bbb; cursor: default; pointer-events: none; }

            /* BOOK button */
            .book-action {
                display: flex;
                justify-content: flex-end;
                margin-top: 24px;
            }

            .book-btn {
                background: #0b0b45;
                color: #fff;
                border: none;
                border-radius: 8px;
                padding: 14px 48px;
                font-size: 1.1rem;
                font-weight: 800;
                letter-spacing: 0.08em;
                cursor: pointer;
                transition: background 0.15s;
            }
            .book-btn:hover { background: #1a1a6e; }

            /* Confirmation toast */
            .toast {
                position: fixed;
                bottom: 32px;
                left: 50%;
                transform: translateX(-50%) translateY(80px);
                background: #0b0b45;
                color: #fff;
                padding: 14px 28px;
                border-radius: 8px;
                font-size: 0.95rem;
                font-weight: 600;
                opacity: 0;
                transition: all 0.3s ease;
                z-index: 999;
                white-space: nowrap;
            }
            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            /* Dark mode */
            .dark-mode .back-btn { color: #aaa; }
            .dark-mode .back-btn:hover { color: #e0e0e0; }
            .dark-mode .detail-room-title,
            .dark-mode .detail-label,
            .dark-mode .detail-colon,
            .dark-mode .detail-value,
            .dark-mode .equipment-item,
            .dark-mode .detail-price { color: #e0e0e0; }
            .dark-mode .cal-box { border-color: #444; }
            .dark-mode .cal-days-header { background: #1e1e2e; color: #aaa; }
            .dark-mode .cal-grid { background: #1e1e2e; }
            .dark-mode .cal-day { color: #e0e0e0; }
            .dark-mode .cal-day:hover { background: #2a2a3e; }
            .dark-mode .cal-day.today { background: #2a2a4e; }
            .dark-mode .timeslot-btn { background: #1e1e2e; border-color: #555; color: #e0e0e0; }
            .dark-mode .timeslot-btn:hover { background: #2a2a3e; border-color: #a0b4ff; }
            .dark-mode .timeslot-btn.selected { background: #a0b4ff; color: #121212; border-color: #a0b4ff; }
        </style>
    </head>

        <main>
            <div class="detail-page">
                <button class="back-btn" onclick="history.back()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>

                <div class="detail-layout">
                    <!-- Left: room details -->
                    <div class="detail-left" id="detailLeft">
                        <p style="color:#999">Loading room...</p>
                    </div>

                    <!-- Right: calendar -->
                    <div class="detail-right">
                        <div class="cal-box">
                            <div class="cal-header">
                                <button class="cal-nav" id="calPrev">&#8592;</button>
                                <span id="calMonthLabel"></span>
                                <button class="cal-nav" id="calNext">&#8594;</button>
                            </div>
                            <div class="cal-days-header">
                                <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>

        <!-- Toast -->

        <script src="./base.js"></script>
        <script src="./base.js"></script>
        <script>
            const params = new URLSearchParams(window.location.search);
            const roomId = params.get('id');
            const rooms  = JSON.parse(localStorage.getItem('uow_rooms') || '[]');
            const room   = rooms.find(r => String(r.id) === String(roomId));

            if (!room) {
                document.getElementById('detailLeft').innerHTML = '<p style="color:red">Room not found.</p>';
            } else {
                renderDetail(room);
            }

            // Parses "8.00 AM" / "1.00 PM" → total minutes
            function parseTime(str) {
                if (!str) return null;
                str = str.trim();
                const isPM = str.includes('PM');
                const isAM = str.includes('AM');
                const num  = parseFloat(str.replace('AM','').replace('PM','').trim());
                let hours  = Math.floor(num);
                let mins   = Math.round((num - hours) * 100);
                if (isPM && hours !== 12) hours += 12;
                if (isAM && hours === 12) hours = 0;
                return hours * 60 + mins;
            }

            // Takes combined "8.00 AM - 12.00 PM" string → ["8-9","9-10","10-11","11-12"]
            function generateSlots(combinedTime) {
                if (!combinedTime) return [];
                const parts = combinedTime.split(' - ');
                if (parts.length < 2) return [];
                const startMins = parseTime(parts[0]);
                const endMins   = parseTime(parts[1]);
                if (startMins === null || endMins === null) return [];
                const slots = [];
                let cur = startMins;
                while (cur + 60 <= endMins) {
                    const sh = Math.floor(cur / 60);
                    const eh = Math.floor((cur + 60) / 60);
                    slots.push(`${sh}-${eh}`);
                    cur += 60;
                }
                return slots;
            }

            let selectedSlots = [];

            function renderDetail(room) {
                const slots = generateSlots(room.time);   // ← uses room.time
                const equipment = [];
                if (room.projector)  equipment.push('Projector');
                if (room.smartboard) equipment.push('Smartboard');
                if (room.printer)    equipment.push('Printer');
                if (room.whiteboard) equipment.push('Whiteboard');

                document.getElementById('detailLeft').innerHTML = `
                    <h1 class="detail-room-title">${room.roomType || 'Room'}</h1>

                    <div class="detail-row">
                        <span class="detail-label">Capacity</span>
                        <span class="detail-colon">:</span>
                        <span class="detail-value">${room.capacity || '—'} pax</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Charging port</span>
                        <span class="detail-colon">:</span>
                        <span class="detail-value">${room.charging || '—'}</span>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Block&amp;Room no</span>
                        <span class="detail-colon">:</span>
                        <span class="detail-value">BLK ${room.blk || '—'}&nbsp; Room ${room.roomNo || '—'}</span>
                    </div>

                    <div class="detail-row" style="align-items:flex-start">
                        <span class="detail-label">Equipment</span>
                        <span class="detail-colon">:</span>
                        <div class="equipment-list">
                            ${equipment.length > 0
                                ? equipment.map(e => `
                                    <div class="equipment-item">
                                        <input type="checkbox" checked disabled>
                                        <span>${e}</span>
                                    </div>`).join('')
                                : '<span class="detail-value">None</span>'
                            }
                        </div>
                    </div>

                    <div class="detail-row" style="align-items:flex-start">
                        <span class="detail-label">Time Slot</span>
                        <span class="detail-colon">:</span>
                        <div class="timeslot-wrap" id="slotWrap">
                            ${slots.length > 0
                                ? slots.map(s => `
                                    <button class="timeslot-btn" data-slot="${s}" onclick="toggleSlot(this)">${s}</button>
                                `).join('')
                                : '<span class="detail-value">No slots available</span>'
                            }
                        </div>
                    </div>

                    <div class="detail-row">
                        <span class="detail-label">Price</span>
                        <span class="detail-colon">:</span>
                        <span class="detail-value">S$ ${parseFloat(room.price || 0).toFixed(2)}</span>
                    </div>
                `;
            }

            function toggleSlot(btn) {
                const slot = btn.dataset.slot;
                btn.classList.toggle('selected');
                if (btn.classList.contains('selected')) {
                    selectedSlots.push(slot);
                } else {
                    selectedSlots = selectedSlots.filter(s => s !== slot);
                }
            }

            const MONTHS = ['January','February','March','April','May','June',
                            'July','August','September','October','November','December'];
            const today = new Date();
            let calYear  = today.getFullYear();
            let calMonth = today.getMonth();
            let selectedDate = null;

            function renderCal() {
                document.getElementById('calMonthLabel').textContent = `${MONTHS[calMonth]} ${calYear}`;
                const grid = document.getElementById('calGrid');
                grid.innerHTML = '';
                const firstDay   = new Date(calYear, calMonth, 1).getDay();
                const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();

                for (let i = 0; i < firstDay; i++) {
                    const blank = document.createElement('div');
                    blank.className = 'cal-day empty';
                    grid.appendChild(blank);
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'cal-day';
                    cell.textContent = d;
                    const thisDate     = new Date(calYear, calMonth, d);
                    const todayMidnight = new Date(today.getFullYear(), today.getMonth(), today.getDate());

                    if (thisDate < todayMidnight) cell.classList.add('past');
                    if (d === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear())
                        cell.classList.add('today');
                    if (selectedDate &&
                        d === selectedDate.getDate() &&
                        calMonth === selectedDate.getMonth() &&
                        calYear === selectedDate.getFullYear())
                        cell.classList.add('selected');

                    cell.addEventListener('click', () => {
                        if (cell.classList.contains('past')) return;
                        selectedDate = new Date(calYear, calMonth, d);
                        renderCal();
                    });
                    grid.appendChild(cell);
                }
            }

            document.getElementById('calPrev').addEventListener('click', () => {
                calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCal();
            });
            document.getElementById('calNext').addEventListener('click', () => {
                calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCal();
            });

            renderCal();

            document.getElementById('bookBtn').addEventListener('click', () => {
                if (!selectedDate) { showToast('Please select a date from the calendar.'); return; }
                if (selectedSlots.length === 0) { showToast('Please select at least one time slot.'); return; }

                // Write pending booking then go to confirmation page
                const pending = {
                    id: Date.now(),
                    roomId:   room.id,
                    roomType: room.roomType,
                    block:    room.blk,
                    roomNo:   room.roomNo,
                    capacity: room.capacity,
                    price:    room.price,
                    date:     selectedDate.toISOString().split('T')[0],
                    slots:    [...selectedSlots],
                    bookedAt: new Date().toISOString()
                };
                localStorage.setItem('uow_pending_booking', JSON.stringify(pending));
                window.location.href = './booking-confirm.html';
            });

            function showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3500);
            }
        </script>
    </body>
