<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Room Detail - UOW Room Booking System</title>
        <link rel="stylesheet" href="./loggedin.css">
        <style>
            .create-room-page {
                padding: 36px 48px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }
            .page-title {
                font-size: 2rem;
                font-weight: 800;
                color: #0b0b45;
                margin-bottom: 36px;
                width: 100%;
                max-width: 780px;
                text-align: left;
                align-self: center;
            }
            .create-room-layout {
                display: flex;
                gap: 60px;
                align-items: flex-start;
            }
            .create-form {
                display: flex;
                flex-direction: column;
                gap: 28px;
                min-width: 420px;
            }
            .form-row {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .form-row label {
                width: 160px;
                font-size: 1.45rem;
                color: #111;
                flex-shrink: 0;
            }
            .form-colon { font-size: 1rem; color: #111; }

            .form-value {
                width: 200px;
                padding: 10px 12px;
                border: 1px solid #ccc;
                border-radius: 4px;
                font-size: 1rem;
                color: #444;
                background: #f5f5f5;
                min-height: 42px;
                display: flex;
                align-items: center;
            }

            .form-value--short { width: 80px; }
            .form-value--medium { width: 160px; }
            .form-value--wide { width: 240px; }

            .blk-room-group, .price-group {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .blk-label { font-size: 1rem; color: #111; white-space: nowrap; }

            .form-row--equipment { align-items: flex-start; }
            .checkbox-group { display: flex; flex-direction: column; gap: 10px; }
            .checkbox-item {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 1rem;
                color: #111;
                width: auto !important;
            }
            .checkbox-item input[type="checkbox"] {
                width: 18px;
                height: 18px;
                accent-color: #0b0b45;
            }

            .photo-upload-box {
                display: flex;
                flex-direction: column;
                align-items: center;
                border: 1px solid #ccc;
                border-radius: 4px;
                padding: 16px;
                width: 260px;
                gap: 12px;
                background: #f5f5f5;
            }
            .photo-preview {
                width: 200px;
                height: 160px;
                border: 1px solid #ccc;
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                background: #fafafa;
            }
            .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
            .no-photo-label {
                font-size: 0.85rem;
                color: #aaa;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="nav-panel" id="navPanel">
            <button class="nav-hamburger panel-close" id="panelClose" aria-label="Close menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="panel-nav">
                <a href="./profile.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Profile
                </a>
                <a href="./history.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>History

                <a href="./settings.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Setting
                </a>
                <a href="./qa.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Q & A

                </a>
                <a href="./feedback.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Feedback

        <header class="site-header">
            <a href="./staff-dashboard.html" class="site-logo-link">
                <img src="./assets/uowlogo.svg" alt="University of Wollongong Logo" width="48" height="48"></a>

                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </div>
        </header>
        <div class="header-divider"></div>
        <nav class="nav-bar">
            <button class="nav-hamburger" id="menuHamburger" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
        </nav>

        <main>
            <div class="create-room-page">
                <h1 class="page-title">Room Detail</h1>
                <div class="create-room-layout">

                    <div class="create-form">

                        <div class="form-row">
                            <label>Room Type</label>
                            <span class="form-colon">:</span>
                            <div class="form-value" id="valRoomType"></div>
                        </div>

                        <div class="form-row">
                            <label>Capacity</label>
                            <span class="form-colon">:</span>
                            <div class="form-value" id="valCapacity"></div>
                        </div>

                        <div class="form-row">
                            <label>Charging port</label>
                            <span class="form-colon">:</span>
                            <div class="form-value" id="valCharging"></div>
                        </div>

                        <div class="form-row">
                            <label>Date</label>
                            <span class="form-colon">:</span>
                            <div class="form-value" id="valDate"></div>
                        </div>

                        <div class="form-row">
                            <label>Time</label>
                            <span class="form-colon">:</span>
                            <div class="form-value" id="valTime"></div>
                        </div>

                        <div class="form-row">
                            <label>Block &amp; Room No.</label>
                            <span class="form-colon">:</span>
                            <div class="blk-room-group">
                                <span class="blk-label">BLK</span>
                                <div class="form-value form-value--short" id="valBlk"></div>
                                <span class="blk-label">Room</span>
                                <div class="form-value form-value--medium" id="valRoomNo"></div>
                            </div>
                        </div>

                        <div class="form-row">
                            <label>Price</label>
                            <span class="form-colon">:</span>
                            <div class="price-group">
                                <span class="blk-label">S$</span>
                                <div class="form-value form-value--wide" id="valPrice"></div>
                            </div>
                        </div>

                        <div class="form-row form-row--equipment">
                            <label>Equipment</label>
                            <span class="form-colon">:</span>
                            <div class="checkbox-group">
                                <label class="checkbox-item">
                                    <input type="checkbox" id="valProjector" disabled> Projector
                                </label>
                                <label class="checkbox-item">
                                    <input type="checkbox" id="valSmartboard" disabled> Smartboard
                                </label>
                            </div>
                        </div>

                    </div>

                    <div class="photo-upload-box">
                        <div class="photo-preview" id="photoPreview">
                            <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="none" stroke="#aaa" stroke-width="1.2" viewBox="0 0 24 24">
                                <rect x="3" y="3" width="18" height="18" rx="1"/>
                                <circle cx="8.5" cy="8.5" r="1.5"/>
                                <polyline points="21 15 16 10 5 21"/>
                            </svg>
                        </div>
                        <p class="no-photo-label">Room Photo</p>
                    </div>

                </div>
            </div>
        </main>

        <script src="./base.js"></script>
        <script>
            if (sessionStorage.getItem('uow_darkmode') === 'true') {
                    document.documentElement.classList.add('dark-mode');
                }

            const params = new URLSearchParams(window.location.search);
            const roomId = parseInt(params.get('id'));
            const rooms  = JSON.parse(localStorage.getItem('uow_rooms') || '[]');
            const room   = rooms.find(r => r.id === roomId);

            if (!room) {
                alert('Room not found.');
                window.location.href = './history.html';
            }

            // Fill all read-only values
            document.getElementById('valRoomType').textContent = room.roomType  || '—';
            document.getElementById('valCapacity').textContent = room.capacity  || '—';
            document.getElementById('valCharging').textContent = room.charging  || '—';
            document.getElementById('valBlk').textContent      = room.blk       || '—';
            document.getElementById('valRoomNo').textContent   = room.roomNo    || '—';
            document.getElementById('valPrice').textContent    = room.price
                ? parseFloat(room.price).toFixed(2) : '—';
            document.getElementById('valDate').textContent     = room.date      || '—';
            document.getElementById('valTime').textContent     = room.time      || '—';

            document.getElementById('valProjector').checked  = room.projector;
            document.getElementById('valSmartboard').checked = room.smartboard;

            

            if (room.photo) {
                document.getElementById('photoPreview').innerHTML =
                    `<img src="${room.photo}" alt="Room photo">`;
            }
        </script>
    </body>
</html>
