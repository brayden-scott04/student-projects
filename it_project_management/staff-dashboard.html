<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Staff Dashboard - UOW Room Booking System</title>
        <link rel="stylesheet" href="./loggedin.css">

        <style>
            /*Search bar*/
            .nav-search {
                display: flex;
                align-items: center;
                gap: 8px;
                position: absolute; 
                background-color: #ffffff;
                left: 50%; 
                transform: translateX(-50%); 
                width: 300px;
            }

            .search-icon {
                width: 20px;
                height: 20px;
                display: block;
                flex-shrink: 0;
            }

            .search-input {
                width: 340px;
                padding: 7px 0;
                border: none;                           
                border-bottom: 1px solid #b0b0c8;      
                border-radius: 0;                       
                font-size: 0.9em;
                color: #0b0b45;
                background: transparent;               
                outline: none;
                transition: border-color 0.2s;
            }

            .search-input:focus {
                border-bottom-color: #0b0b45;
                box-shadow: none;
            }

            .search-input::placeholder {
                color: #aaa;
            }

            .dashboard-hero {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                min-height: 70vh;
                gap: 1px;
                text-align: center;
                padding-top: 8vh;
                padding-inline: 24px;
            }

            .dashboard-title {
                font-size: clamp(1.8rem, 4vw, 3rem);
                font-weight: 750;
                color: #0b0b45;
                letter-spacing: 0.02em;
                white-space: nowrap;      
            }

            .dashboard-name {
                font-size: clamp(1.3rem, 1.1vw, 1.5rem);  
                font-weight: 600;
                color: #0b0b45;
                letter-spacing: 0.03em;
            }

            .dashboard-subtitle {
                font-size: clamp(1.3rem, 1.1vw, 1.5rem);  
                font-weight: 600;
                color: #0b0b45;
                letter-spacing: 0.03em;
            }

            .dashboard-actions {
                display: flex;
                gap: 28px;
                margin-top: 28px;
                justify-content: center;
                align-items: center;
            }

            .dash-btn {
                padding: 22px 42px;
                background-color: #0b0b45;
                color: #ffffff;
                font-size: 1rem;
                font-weight: 800;
                letter-spacing: 0.12em;
                border: none;
                border-radius: 12px;      
                cursor: pointer;
                min-width: 160px;
                transition: background-color 0.2s, transform 0.15s;
            }

            .dash-btn:hover {
                background-color: #1a1a7a;
                transform: translateY(-2px);
            }

            .dash-btn:active {
                background-color: #080830;
                transform: translateY(0);
            }

            .menu-overlay {
                display: none;
                position: fixed;
                inset: 0;                          /* covers entire screen */
                background-color: rgba(0, 0, 0, 0.4);
                z-index: 98;                       
                opacity: 0;
                transition: opacity 0.3s ease;
            }

            .menu-overlay.active {
                display: block;
                opacity: 1;
            }
            .nav-panel {
                position: fixed;
                top: 0;
                left: 0;
                width: 280px;
                height: 100vh;
                background-color: #ffffff;
                z-index: 99;
                transform: translateX(-100%);     
                transition: transform 0.3s ease;
                display: flex;
                flex-direction: column;
                padding-top: 12px;
                box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            }

            .nav-panel.open {
                transform: translateX(0);         
            }

            .panel-close {
                margin: 8px 0 16px 16px;
                align-self: flex-start;
            }

            .panel-nav {
                display: flex;
                flex-direction: column;
            }

            .panel-item {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 18px 24px;
                font-size: 1rem;
                font-weight: 500;
                color: #0b0b45;
                text-decoration: none;
                border-bottom: 1px solid #ececec;
                transition: background-color 0.15s;
            }

            .panel-item:hover {
                background-color: #f4f4f8;
            }

            .panel-item svg {
                flex-shrink: 0;
                color: #0b0b45;
            }

            .menu-overlay {
                display: none;
                position: fixed;
                inset: 0;
                background-color: rgba(0, 0, 0, 0.4);
                z-index: 98;
                opacity: 0;
                transition: opacity 0.3s ease;
            }
        </style>
    </head>
    
    <body>
        <div class="menu-overlay" id="menuOverlay"></div>


        <div class="nav-panel" id="navPanel">
            <button class="nav-hamburger panel-close" id="panelClose" aria-label="Close menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="panel-nav">
                <a href="./profile.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                    Profile
                </a>
                <a href="./history.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
                    History
                </a>
                <a href="./settings.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                    Setting
                </a>
                <a href="./qa.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                    Q & A
                </a>
                <a href="./contact.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                    Contact Us
                </a>
                <a href="./feedback.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    Feedback
                </a>
            </nav>
        </div>

        <header class="site-header">
            <a href="./staff-dashboard.html" class="site-logo-link">
                <img src="./assets/uowlogo.svg" alt="University of Wollongong Logo" width="48" height="48"></a>
                <span class="site-title">UOW</span>
            
            <div class="header-icons">
                <!-- Bell -->
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                </svg>
                <!-- User -->
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
                <!-- Logout -->
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
            </div>
        </header>

        <div class="header-divider"></div>
        <nav class="nav-bar">
            <button class="nav-hamburger" id="menuHamburger" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-search">
                <img src="./assets/magnifying_glass.png" alt="Search" class="search-icon" width="20" height="20">
                <input type="text" class="search-input" placeholder="Search Keyword">
            </div>
        </nav>
        <main>
            <div class="dashboard-hero">
                <h1 class="dashboard-title">Welcome to UOW Room Booking System</h1>
                <p class="dashboard-name">Mr Lee</p>
                <p class="dashboard-subtitle">Create, Manage and Optimize Room Usage</p>
            
                <div class="dashboard-actions">
                <button class="dash-btn" onclick="window.location.href='./manage.html'">MANAGE</button>
                <button class="dash-btn" onclick="window.location.href='./create.html'">CREATE</button>
                <button class="dash-btn" onclick="window.location.href='./schedule.html'">SCHEDULE</button>
                </div>
            </div>
        </main>
        
        <script>
            const hamburger = document.getElementById('menuHamburger');
            const panelClose = document.getElementById('panelClose');
            const overlay = document.getElementById('menuOverlay');
            const navPanel = document.getElementById('navPanel');

            function openMenu() {
                navPanel.classList.add('open');
                overlay.style.display = 'block';
                requestAnimationFrame(() => overlay.style.opacity = '1');
            }

            function closeMenu() {
                navPanel.classList.remove('open');
                overlay.style.opacity = '0';
                setTimeout(() => overlay.style.display = 'none', 300);
            }

            hamburger.addEventListener('click', openMenu);
            panelClose.addEventListener('click', closeMenu);
            overlay.addEventListener('click', closeMenu);

            if (sessionStorage.getItem('uow_darkmode') === 'true') {
        document.documentElement.classList.add('dark-mode');
        }
        </script>

        </body>

</html>
