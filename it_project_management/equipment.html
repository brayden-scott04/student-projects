<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Book an Equipment - UOW Room Booking System</title>
        <link rel="stylesheet" href="./loggedin.css">
        <script>
            if (sessionStorage.getItem('uow_darkmode') === 'true') {
                document.documentElement.classList.add('dark-mode');
            }
        </script>
        <style>
            .equipment-page {
                padding: 36px 48px;
                max-width: 900px;
            }

            .page-title {
                font-size: 1.6rem;
                font-weight: 800;
                color: #111;
                margin-bottom: 4px;
            }

            .page-subtitle {
                font-size: 0.92rem;
                color: #555;
                margin-bottom: 28px;
            }

            .equipment-grid {
                display: grid;
                grid-template-columns: repeat(2, 1fr);
                gap: 16px;
                max-width: 700px;
            }

            .equipment-card {
                display: flex;
                align-items: center;
                gap: 16px;
                border: 1.5px solid #ccc;
                border-radius: 8px;
                padding: 20px 20px;
                background: #fff;
            }

            .equipment-icon {
                flex-shrink: 0;
                width: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
                color: #0b0b45;
            }

            .equipment-icon svg {
                width: 64px;
                height: 64px;
            }

            .equipment-info {
                display: flex;
                flex-direction: column;
                gap: 12px;
            }

            .equipment-name {
                font-size: 1.15rem;
                font-weight: 800;
                color: #111;
            }

            .detail-btn {
                background: #0b0b45;
                color: #fff;
                border: none;
                border-radius: 6px;
                padding: 9px 22px;
                font-size: 0.88rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                cursor: pointer;
                transition: background 0.15s;
                width: fit-content;
            }
            .detail-btn:hover { background: #1a1a6e; }

            /* Dark mode */
            .dark-mode .page-title { color: #e0e0e0; }
            .dark-mode .page-subtitle { color: #aaa; }
            .dark-mode .equipment-card {
                background: #1e1e2e;
                border-color: #444;
            }
            .dark-mode .equipment-name { color: #e0e0e0; }
            .dark-mode .equipment-icon { color: #a0b4ff; }
        </style>
    </head>
    <body>

        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="nav-panel" id="navPanel">
            <button class="nav-hamburger panel-close" id="panelClose" aria-label="Close menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="panel-nav">
                <a href="./profile.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Profile
                </a>
                <a href="./student-history.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>History
                </a>
                <a href="./settings.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Setting

                <a href="./qa.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Q &amp; A

                </a>
                <a href="./feedback.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Feedback
                </a>
            </nav>
        </div>

        <header class="site-header">
            <a href="./student-dashboard.html" class="site-logo-link">
                <img src="./assets/uowlogo.svg" alt="University of Wollongong Logo" width="48" height="48">
                <span class="site-title"></span>
            </a>
            <div class="header-icons">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </div>
        </header>
        <div class="header-divider"></div>
        <nav class="nav-bar">
            <button class="nav-hamburger" id="menuHamburger" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
        </nav>

        <main>
            <div class="equipment-page">
                <h1 class="page-title">Book an Equipment</h1>
                <p class="page-subtitle">equipment available:</p>

                <div class="equipment-grid" id="equipmentGrid">
                    <!-- Cards rendered by JS -->
                </div>
            </div>
        </main>

        <script src="./base.js"></script>
        <script>
            const equipmentList = [
                {
                    id: 'keylock',
                    name: 'Key Lock',
                    icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <circle cx="8" cy="15" r="5"/>
                        <path d="M13 15h8M17 15v-3"/>
                        <circle cx="8" cy="15" r="2" fill="currentColor" stroke="none"/>
                    </svg>`
                },
                {
                    id: 'moreplug',
                    name: 'More plug',
                    icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M12 2v4M8 3v3M16 3v3"/>
                        <rect x="7" y="6" width="10" height="6" rx="1"/>
                        <path d="M12 12v4"/>
                        <circle cx="12" cy="18" r="2"/>
                    </svg>`
                },
                {
                    id: 'projector',
                    name: 'Projector',
                    icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <rect x="2" y="7" width="20" height="10" rx="2"/>
                        <circle cx="12" cy="12" r="2"/>
                        <path d="M6 12h.01M18 12h.01"/>
                        <path d="M12 17v4M9 21h6"/>
                    </svg>`
                }
            ];

            const grid = document.getElementById('equipmentGrid');

            equipmentList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'equipment-card';
                card.innerHTML = `
                    <div class="equipment-icon">${item.icon}</div>
                    <div class="equipment-info">
                        <span class="equipment-name">${item.name}</span>
                        <button class="detail-btn" onclick="goToDetail('${item.id}')">DETAIL</button>
                    </div>
                `;
                grid.appendChild(card);
            });

            function goToDetail(id) {
                window.location.href = `./equipment-detail.html?id=${id}`;
            }
        </script>
    </body>
</html>
