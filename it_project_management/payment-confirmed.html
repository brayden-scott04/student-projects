<!DOCTYPE html>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Booking Confirmed - UOW Room Booking System</title>
        <link rel="stylesheet" href="./loggedin.css">
        <script>
            if (sessionStorage.getItem('uow_darkmode') === 'true') {
                document.documentElement.classList.add('dark-mode');
            }
        </script>
        <style>
            .confirmed-page {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 80px 48px;
                text-align: center;
            }

            .success-icon {
                width: 80px;
                height: 80px;
                background: #4caf50;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 28px;
            }

            .success-icon svg {
                width: 44px;
                height: 44px;
            }

            .confirmed-msg {
                font-size: 1.1rem;
                font-weight: 600;
                color: #111;
                line-height: 1.7;
                margin-bottom: 32px;
            }

            .finish-btn {
                background: #0b0b45;
                color: #fff;
                border: none;
                border-radius: 8px;
                padding: 13px 48px;
                font-size: 0.97rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                cursor: pointer;
                transition: background 0.15s;
            }
            .finish-btn:hover { background: #1a1a6e; }

            /* Dark mode */
            .dark-mode .confirmed-msg { color: #e0e0e0; }
        </style>
    </head>
