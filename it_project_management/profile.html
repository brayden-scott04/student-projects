        <style>
            .profile-page {
                display: flex;
                gap: 60px;
                padding: 40px 48px;
                align-items: flex-start;
            }

            .profile-left {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 28px;
                min-width: 280px;
                padding-left: 100px;
            }

            .profile-avatar {
                width: 140px;
                height: 140px;
                border-radius: 50%;
                border: 3px solid #ddd;
                background-color: #f0f0f0;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                align-self: center;
            }

            .profile-avatar svg {
                width: 72px;
                height: 72px;
                color: #b0b0b0;
            }

            .profile-fields {
                display: flex;
                flex-direction: column;
                gap: 24px;
            }

            .profile-field label {
                display: block;
                font-weight: 700;
                font-size: 1rem;
                color: #0b0b45;
                margin-bottom: 4px;
            }

            .profile-field p {
                font-size: 1rem;
                color: #222;
                margin: 0;
            }

            .profile-right {
                flex: 1;
                display: flex;
                justify-content: flex-end;
                padding-top: 8px;
            }

            .calendar {
                width: 460px;
                border: 1px solid #ccc;
                border-radius: 4px;
                overflow: hidden;
                font-family: inherit;
            }

            .calendar-header {
                background-color: #0b0b45;
                color: #ffffff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 18px 24px;
            }

            .calendar-header h2 {
                font-size: 1.2rem;
                font-weight: 600;
                letter-spacing: 0.02em;
            }

            .cal-nav {
                background: none;
                border: none;
                color: #ffffff;
                font-size: 1.2rem;
                cursor: pointer;
                padding: 4px 8px;
                border-radius: 4px;
                transition: background 0.15s;
            }

            .cal-nav:hover {
                background: rgba(255,255,255,0.15);
            }

            .calendar-grid {
                background: #fff;
                padding: 12px;
            }

            .calendar-days-header {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                text-align: center;
                margin-bottom: 8px;
            }

            .calendar-days-header span {
                font-size: 0.85rem;
                font-weight: 600;
                color: #0b0b45;
                padding: 8px 0;
            }

            .calendar-dates {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                text-align: center;
                gap: 4px;
            }

            .cal-date {
                padding: 10px 4px;
                font-size: 0.95rem;
                color: #222;
                border-radius: 50%;
                cursor: pointer;
                transition: background 0.15s;
                aspect-ratio: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .cal-date:hover {
                background-color: #e8e8f0;
            }

            .cal-date.today {
                background-color: #0b0b45;
                color: #ffffff;
                font-weight: 700;
            }

            .cal-date.other-month {
                color: #bbb;
            }

            .cal-date.has-event {
                background-color: #e0e0e8;
                border-radius: 50%;
            }

            .page-title {
                font-size: 1.6rem;
                font-weight: 700;
                color: #0b0b45;
                padding: 20px 48px 0px 100px;
            }
        </style>

        <script src="./base.js"></script>
        <script>
            //Calendar
            let current = new Date(2026, 3); // April 2026

            function renderCalendar() {
                const year = current.getFullYear();
                const month = current.getMonth();
                const today = new Date();

                document.getElementById('calMonthYear').textContent =
                    current.toLocaleString('default', { month: 'long', year: 'numeric' });

                const firstDay = new Date(year, month, 1).getDay();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const daysInPrev = new Date(year, month, 0).getDate();

                const grid = document.getElementById('calDates');
                grid.innerHTML = '';

                for (let i = firstDay - 1; i >= 0; i--) {
                    const d = document.createElement('div');
                    d.className = 'cal-date other-month';
                    d.textContent = daysInPrev - i;
                    grid.appendChild(d);
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'cal-date';
                    cell.textContent = d;
                    if (
                        d === today.getDate() &&
                        month === today.getMonth() &&
                        year === today.getFullYear()
                    ) {
                        cell.classList.add('today');
                    }
                    grid.appendChild(cell);
                }

                const total = firstDay + daysInMonth;
                const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
                for (let d = 1; d <= remaining; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'cal-date other-month';
                    cell.textContent = d;
                    grid.appendChild(cell);
                }
            }

            document.getElementById('prevMonth').addEventListener('click', () => {
                current.setMonth(current.getMonth() - 1);
                renderCalendar();
            });
            document.getElementById('nextMonth').addEventListener('click', () => {
                current.setMonth(current.getMonth() + 1);
                renderCalendar();
            });

            renderCalendar();
            
            if (sessionStorage.getItem('uow_darkmode') === 'true') {
        document.documentElement.classList.add('dark-mode');
        }
        </script>
