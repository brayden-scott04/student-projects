            .confirm-page {

                max-width: 680px;

            .back-btn {
                display: flex;
                align-items: center;
                gap: 6px;
                background: none;
                border: none;
                font-size: 1rem;
                color: #333;
                cursor: pointer;
                margin-bottom: 28px;
                padding: 0;
            }
            .back-btn:hover { color: #0b0b45; }

            .confirm-title {
                font-size: 1.35rem;
                font-weight: 800;
                color: #111;
                margin-bottom: 24px;
            }

            .confirm-detail {
                font-size: 0.97rem;
                color: #111;
                margin-bottom: 14px;
                line-height: 1.6;
            }

            .confirm-actions {
                display: flex;
                justify-content: flex-end;
                gap: 12px;
                margin-top: 36px;
            }

            .btn-edit, .btn-pay {
                background: #0b0b45;
                color: #fff;
                border: none;
                border-radius: 8px;
                padding: 13px 32px;
                font-size: 0.97rem;
                font-weight: 700;
                letter-spacing: 0.06em;
                cursor: pointer;
                transition: background 0.15s;
            }
            .btn-edit:hover, .btn-pay:hover { background: #1a1a6e; }

            /* Dark mode */
            .dark-mode .back-btn { color: #aaa; }
            .dark-mode .back-btn:hover { color: #e0e0e0; }
            .dark-mode .confirm-title,
            .dark-mode .confirm-detail { color: #e0e0e0; }
        </style>

        <main>
            <div class="confirm-page">

                <button class="back-btn" onclick="history.back()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </button>

                <h1 class="confirm-title">Please check the following details:</h1>

                <div id="confirmDetails">
                    <p style="color:#999">Loading...</p>
                </div>

                <div class="confirm-actions">
                    <button class="btn-edit" id="editBtn">EDIT</button>
                    <button class="btn-pay"  id="payBtn">MAKE PAYMENT</button>
                </div>

            </div>
        </main>

        <script src="./base.js"></script>
        <script>
            const pending = JSON.parse(localStorage.getItem('uow_pending_booking') || 'null');
            const user    = JSON.parse(localStorage.getItem('uow_logged_in_user')  || 'null');

            if (!pending) {
                document.getElementById('confirmDetails').innerHTML =
                    '<p style="color:red">No booking found. Please go back and try again.</p>';
            } else {
                renderDetails(pending, user);
            }

            function formatDate(dateStr) {
                const d    = new Date(dateStr + 'T00:00:00');
                const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
                return `${d.getDate()}-${d.getMonth()+1}-${d.getFullYear()} (${days[d.getDay()]})`;
            }

            function formatSlots(slots) {
                if (!slots || slots.length === 0) return '—';
                const pairs = slots.map(s => s.split('-').map(Number));
                const start = Math.min(...pairs.map(p => p[0]));
                const end   = Math.max(...pairs.map(p => p[1]));
                const ampm  = end > 12 ? 'pm' : 'am';
                return `${start}00 H - ${end}00 H`;
            }

            function renderDetails(b, u) {
                const title = u && u.title    ? u.title + ' ' : 'Mr ';
                const name  = u && u.fullName ? u.fullName
                            : u && u.name     ? u.name : 'Lee Dong Min';
                const sid   = u && u.studentId ? u.studentId
                            : u && u.id        ? u.id : '1997330';
                const email = u && u.email    ? u.email : 'dongminlee@uowmail.edu.auu';

                document.getElementById('confirmDetails').innerHTML = `
                    <p class="confirm-detail">Student name: ${title}${name}</p>
                    <p class="confirm-detail">Student ID: ${sid}</p>
                    <p class="confirm-detail">Email: ${email}</p>
                    <p class="confirm-detail">Room booking: ${b.roomType || '—'}</p>
                    <p class="confirm-detail">Booking date and time: ${formatDate(b.date)}, ${formatSlots(b.slots)}</p>
                `;
            }

            document.getElementById('editBtn').addEventListener('click', () => {
                history.back();
            });

            document.getElementById('payBtn').addEventListener('click', () => {
                if (!pending) return;
                const bookings = JSON.parse(localStorage.getItem('uow_student_bookings') || '[]');
                bookings.push({ ...pending, status: 'pending_payment' });
                localStorage.setItem('uow_student_bookings', JSON.stringify(bookings));
                window.location.href = './payment.html';
            });
        </script>
