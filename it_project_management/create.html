        <meta charset="UTF-8">

        <style>
            /* ── Create Room Page ── */
            .create-room-page {
                padding: 36px 48px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            .page-title {
                font-size: 2rem;
                font-weight: 800;
                color: #0b0b45;
                margin-bottom: 36px;
                width:100%;
                max-width: 780px;
                text-align: left;
                align-self: center;
                padding-right: 100px;
            }

            .create-room-layout {
                display: flex;
                gap: 60px;
                align-items: flex-start;
            }

            /* Form */
            .create-form {
                display: flex;
                flex-direction: column;
                gap: 28px;
                min-width: 420px;
            }

            .form-row {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            .form-row label {
                width: 160px;
                font-size: 1.45rem;
                color: #111;
                flex-shrink: 0;
            }

            .form-colon {
                font-size: 1rem;
                color: #111;
            }

            .form-select {
                width: 200px;
                padding: 10px 12px;
                border: 1px solid #999;
                border-radius: 4px;
                font-size: 1rem;
                color: #111;
                background: #fff;
                appearance: auto;
                cursor: pointer;
            }

            .form-select--short {
                width: 80px;
            }

            .form-select--medium {
                width: 160px;
            }

            .blk-room-group,
            .price-group {
                display: flex;
                align-items: center;
                gap: 10px;
            }

            .blk-label {
                font-size: 1rem;
                color: #111;
                white-space: nowrap;
            }

            .form-input {
                width: 240px;
                padding: 10px 12px;
                border: 1px solid #999;
                border-radius: 4px;
                font-size: 1rem;
                color: #111;
                outline: none;
            }

            .form-input:focus {
                border-color: #0b0b45;
            }

            /* Equipment checkboxes */
            .form-row--equipment {
                align-items: flex-start;
            }

            .checkbox-group {
                display: flex;
                flex-direction: column;
                gap: 10px;
            }

            .checkbox-item {
                display: flex;
                align-items: center;
                gap: 10px;
                font-size: 1rem;
                color: #111;
                cursor: pointer;
                width: auto !important;   /* override label width */
            }

            .checkbox-item input[type="checkbox"] {
                width: 18px;
                height: 18px;
                cursor: pointer;
                accent-color: #0b0b45;
            }

            /* Photo Upload Box */
            .photo-upload-box {
                display: flex;
                flex-direction: column;
                align-items: center;
                border: 1px solid #999;
                border-radius: 4px;
                padding: 16px;
                width: 260px;
                gap: 12px;
            }

            .photo-preview {
                width: 200px;
                height: 160px;
                border: 1px solid #ccc;
                border-radius: 4px;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                background: #fafafa;
            }

            .photo-preview img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .upload-label {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                cursor: pointer;
                font-size: 0.9rem;
                color: #333;
                text-align: center;
            }

            .upload-label:hover svg {
                stroke: #1a1a7a;
            }

            .create-submit-row {
                margin-top: 40px;
            }

            .form-select--time {
                width: 120px;
            }

        </style>
    </head>

        <main>
            <div class="create-room-page">
            <h1 class="page-title">Create Room</h1>

            <div class="create-room-layout">
                <div class="create-form">

                    <div class="form-row">
                        <label>Room Type</label>
                        <span class="form-colon">:</span>
                        <select class="form-select" id="inputRoomType">
                            <option value=""></option>
                            <option>Multipurpose Hall</option>
                            <option>Discussion Room</option>
                            <option>Study Room</option>
                            <option>Theatre</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label>Capacity</label>
                        <span class="form-colon">:</span>
                        <select class="form-select" id="inputCapacity">
                            <option value=""></option>
                            <option>10</option>
                            <option>20</option>
                            <option>50</option>
                            <option>100</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label>Charging port</label>
                        <span class="form-colon">:</span>
                        <select class="form-select" id="inputCharging">
                            <option value=""></option>
                            <option>Yes</option>
                            <option>No</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label>Date</label>
                        <span class="form-colon">:</span>
                        <input type="date" class="form-select" id="inputDate">
                    </div>

                    <div class="form-row">
                        <label>Time</label>
                        <span class="form-colon">:</span>
                        <div class="blk-room-group">
                            <select class="form-select form-select--time" id="inputTimeStart">
                                <option value="">From</option>
                                <option>8.00 AM</option>
                                <option>9.00 AM</option>
                                <option>10.00 AM</option>
                                <option>11.00 AM</option>
                                <option>12.00 PM</option>
                                <option>1.00 PM</option>
                                <option>2.00 PM</option>
                                <option>3.00 PM</option>
                                <option>4.00 PM</option>
                                <option>5.00 PM</option>
                                <option>6.00 PM</option>
                                <option>7.00 PM</option>
                                <option>8.00 PM</option>
                            </select>
                            <span class="blk-label">–</span>
                            <select class="form-select form-select--time" id="inputTimeEnd">
                                <option value="">To</option>
                                <option>9.00 AM</option>
                                <option>10.00 AM</option>
                                <option>11.00 AM</option>
                                <option>12.00 PM</option>
                                <option>1.00 PM</option>
                                <option>2.00 PM</option>
                                <option>3.00 PM</option>
                                <option>4.00 PM</option>
                                <option>5.00 PM</option>
                                <option>6.00 PM</option>
                                <option>7.00 PM</option>
                                <option>8.00 PM</option>
                                <option>9.00 PM</option>
                            </select>
                        </div>
                    </div>


                    <div class="form-row">
                        <label>Block &amp; Room No.</label>
                        <span class="form-colon">:</span>
                        <div class="blk-room-group">
                            <span class="blk-label">BLK</span>
                            <select class="form-select form-select--short" id="inputBlk">
                                <option value=""></option>
                                <option>A</option>
                                <option>B</option>
                                <option>C</option>
                            </select>
                            <span class="blk-label">Room</span>
                            <select class="form-select form-select--medium" id="inputRoomNo">
                                <option value=""></option>
                                <option>101</option>
                                <option>102</option>
                                <option>201</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <label>Price</label>
                        <span class="form-colon">:</span>
                        <div class="price-group">
                            <span class="blk-label">S$</span>
                            <input type="number" class="form-input" placeholder="" id="inputPrice">
                        </div>
                    </div>

                    <div class="form-row form-row--equipment">
                        <label>Equipment</label>
                        <span class="form-colon">:</span>
                        <div class="checkbox-group">
                            <label class="checkbox-item">
                                <input type="checkbox" id="inputProjector"> Projector
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="inputSmartboard"> Smartboard
                            </label>
                        </div>
                    </div>

                </div>

                <div class="photo-upload-box">
                    <div class="photo-preview" id="photoPreview">
                        <svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" fill="none" stroke="#aaa" stroke-width="1.2" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="1"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </div>
                    <label class="upload-label" for="photoInput">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24">
                            <polyline points="16 16 12 12 8 16"/>
                            <line x1="12" y1="12" x2="12" y2="21"/>
                            <path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>
                        </svg>
                        <span>Upload Room Photo here</span>
                        <input type="file" id="photoInput" accept="image/*" style="display:none">
                    </label>
                </div>
            </div>

                <div class="create-submit-row">
                    <button class="dash-btn" id="submitCreateRoom">CREATE</button>
                </div>
            </div>
        </main>

        <script>
            document.getElementById('photoInput').addEventListener('change', function () {
                const file = this.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = e => {
                    document.getElementById('photoPreview').innerHTML =
                        `<img src="${e.target.result}" alt="Room photo">`;
                };
                reader.readAsDataURL(file);
            });

            document.getElementById('submitCreateRoom').addEventListener('click', () => {
                const roomType   = document.getElementById('inputRoomType').value;
                const capacity   = document.getElementById('inputCapacity').value;
                const charging   = document.getElementById('inputCharging').value;
                const timeEnd    = document.getElementById('inputTimeEnd').value;     
                const dateRaw    = document.getElementById('inputDate').value;        
                const timeStart  = document.getElementById('inputTimeStart').value;   
                const blk        = document.getElementById('inputBlk').value;
                const roomNo     = document.getElementById('inputRoomNo').value;
                const price      = document.getElementById('inputPrice').value;
                const projector  = document.getElementById('inputProjector').checked;
                const smartboard = document.getElementById('inputSmartboard').checked;
                const photoEl    = document.querySelector('#photoPreview img');
                const photo      = photoEl ? photoEl.src : null;

                if (!roomType || !dateRaw) {
                    alert('Please fill in Room Type and Date.');
                    return;
                }

                const dateFormatted = new Date(dateRaw + 'T00:00:00')
                    .toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });

                const room = {
                    id: Date.now(),
                    roomType,
                    capacity,
                    charging,
                    blk,
                    roomNo,
                    price,
                    projector,
                    smartboard,
                    photo,
                    date: dateFormatted,
                    time: `${timeStart} - ${timeEnd}`,
                };

                const existing = JSON.parse(localStorage.getItem('uow_rooms') || '[]');
                existing.push(room);
                localStorage.setItem('uow_rooms', JSON.stringify(existing));

                alert('Room created successfully!');
                window.location.href = './history.html';
            });
            if (sessionStorage.getItem('uow_darkmode') === 'true') {
        document.documentElement.classList.add('dark-mode');
        }
        </script>
        <script src="./base.js"></script>
