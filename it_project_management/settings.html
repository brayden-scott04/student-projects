        <style>
            .settings-page {
                padding: 36px 48px;
                max-width: 700px;
            }

            .settings-title {
                display: flex;
                align-items: center;
                gap: 14px;
                font-size: 2rem;
                font-weight: 800;
                color: #0b0b45;
                margin-bottom: 32px;
            }

            .settings-list {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .settings-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 20px 24px;
                border: 1.5px solid #ccc;
                border-radius: 999px;
                cursor: pointer;
                transition: background 0.15s;
                background: #fff;
            }

            .settings-row:hover { background: #f4f4f8; }

            .settings-row-left {
                display: flex;
                align-items: center;
                gap: 16px;
                font-size: 1.3rem;
                font-weight: 500;
                color: #111;
            }

            .settings-row-left svg {
                flex-shrink: 0;
                color: #111;
            }

            .settings-chevron {
                color: #aaa;
                font-size: 1.2rem;
            }

            /* Theme sub-panel (hidden by default) */
            .theme-panel {
                display: none;
                padding: 20px 24px;
                border: 1.5px solid #ccc;
                border-radius: 20px;
                background: #fafafa;
                margin-top: -8px;
            }

            .theme-panel.open { display: block; }

            .theme-option {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 12px 0;
                font-size: 1.1rem;
                color: #111;
                border-bottom: 1px solid #eee;
            }

            .theme-option:last-child { border-bottom: none; }

            /* Toggle switch */
            .toggle-switch {
                position: relative;
                width: 52px;
                height: 28px;
                flex-shrink: 0;
            }

            .toggle-switch input {
                opacity: 0;
                width: 0;
                height: 0;
            }

            .toggle-slider {
                position: absolute;
                inset: 0;
                background: #ccc;
                border-radius: 999px;
                cursor: pointer;
                transition: background 0.2s;
            }

            .toggle-slider::before {
                content: '';
                position: absolute;
                width: 22px;
                height: 22px;
                left: 3px;
                top: 3px;
                background: #fff;
                border-radius: 50%;
                transition: transform 0.2s;
            }

            .toggle-switch input:checked + .toggle-slider {
                background: #0b0b45;
            }

            .toggle-switch input:checked + .toggle-slider::before {
                transform: translateX(24px);
            }

            /* Dark mode styles — applied when body has class "dark-mode" */
            body.dark-mode {
                background: #121212;
                color: #e0e0e0;
            }

            body.dark-mode .site-header {
                background: #1a1a2e;
                border-color: #333;
            }

            body.dark-mode .site-title { color: #e0e0e0; }
            body.dark-mode .header-divider { border-color: #333; }
            body.dark-mode .nav-bar { background: #1a1a2e; border-color: #333; }

            body.dark-mode .settings-title { color: #a0a8d0; }

            body.dark-mode .settings-row {
                background: #1e1e2e;
                border-color: #333;
                color: #e0e0e0;
            }

            body.dark-mode .settings-row:hover { background: #2a2a3e; }
            body.dark-mode .settings-row-left { color: #e0e0e0; }
            body.dark-mode .settings-row-left svg { color: #e0e0e0; }

            body.dark-mode .theme-panel {
                background: #1a1a2e;
                border-color: #333;
            }

            body.dark-mode .theme-option {
                color: #e0e0e0;
                border-color: #333;
            }

            body.dark-mode .nav-panel {
                background: #1a1a2e;
            }

            body.dark-mode .panel-item {
                color: #e0e0e0;
                border-color: #333;
            }

            body.dark-mode .panel-item:hover { background: #2a2a3e; }

            body.dark-mode .nav-hamburger span { background: #e0e0e0; }
        </style>

        <script src="./base.js"></script>
        <script>
            const isDark = sessionStorage.getItem('uow_darkmode') === 'true';
            if (isDark) document.documentElement.classList.add('dark-mode');
            document.getElementById('darkModeToggle').checked = isDark;

            document.getElementById('themeRow').addEventListener('click', () => {
                document.getElementById('themePanel').classList.toggle('open');
            });

            document.getElementById('darkModeToggle').addEventListener('change', function () {
                if (this.checked) {
                    document.documentElement.classList.add('dark-mode');
                    sessionStorage.setItem('uow_darkmode', 'true');
                } else {
                    document.documentElement.classList.remove('dark-mode');
                    sessionStorage.setItem('uow_darkmode', 'false');
                }
            });

        </script>
