        <style>
            .schedule-page {
                display: flex;
                gap: 48px;
                padding: 36px 48px;
                align-items: flex-start;
            }

            /* ── Left: Booked Rooms ── */
            .schedule-left {
                flex: 1;
                min-width: 0;
            }

            .schedule-left h1 {
                font-size: 2rem;
                font-weight: 800;
                color: #0b0b45;
                margin-bottom: 24px;
            }

            .schedule-room-list {
                display: flex;
                flex-direction: column;
                gap: 16px;
            }

            .schedule-card {
                display: flex;
                align-items: center;
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 16px 20px;
                gap: 20px;
            }

            .schedule-card-photo {
                width: 120px;
                height: 90px;
                border: 1px solid #ccc;
                border-radius: 4px;
                flex-shrink: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #fafafa;
            }

            .schedule-card-photo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .schedule-card-info {
                flex: 1;
            }

            .schedule-card-info h2 {
                font-size: 1.3rem;
                font-weight: 800;
                color: #0b0b45;
                margin-bottom: 4px;
            }

            .schedule-card-info p {
                font-size: 0.95rem;
                color: #444;
                margin-bottom: 2px;
            }

            .schedule-card-actions {
                margin-top: 12px;
            }

            .card-btn {
                padding: 10px 24px;
                background-color: #0b0b45;
                color: #fff;
                font-size: 0.95rem;
                font-weight: 800;
                letter-spacing: 0.08em;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.2s, transform 0.15s;
            }

            .card-btn:hover {
                background-color: #1a1a7a;
                transform: translateY(-1px);
            }

            .no-bookings {
                color: #aaa;
                font-size: 1rem;
                margin-top: 12px;
            }

            /* ── Right: Calendar ── */
            .schedule-right {
                flex-shrink: 0;
                width: 440px;
            }

            .calendar {
                border: 1px solid #ccc;
                border-radius: 6px;
                overflow: hidden;
                user-select: none;
            }

            .calendar-header {
                background-color: #0b0b45;
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 18px 24px;
                font-size: 1.2rem;
                font-weight: 700;
            }

            .cal-nav {
                background: none;
                border: none;
                color: #fff;
                font-size: 1.4rem;
                cursor: pointer;
                padding: 4px 10px;
                border-radius: 4px;
                transition: background 0.15s;
            }

            .cal-nav:hover { background: rgba(255,255,255,0.15); }

            .calendar-grid {
                padding: 16px;
                background: #fff;
            }

            .cal-days-header {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                text-align: center;
                font-weight: 700;
                font-size: 0.95rem;
                color: #0b0b45;
                margin-bottom: 8px;
            }

            .cal-days {
                display: grid;
                grid-template-columns: repeat(7, 1fr);
                gap: 4px;
            }

            .cal-day {
                aspect-ratio: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 50%;
                font-size: 0.95rem;
                color: #111;
                cursor: pointer;
                transition: background 0.15s, color 0.15s;
            }

            .cal-day:hover { background: #e8e8f0; }

            .cal-day.empty { cursor: default; }
            .cal-day.empty:hover { background: none; }

            .cal-day.today {
                background: #dde;
                font-weight: 700;
            }

            .cal-day.selected {
                background: #0b0b45;
                color: #fff;
                font-weight: 700;
            }

            .cal-day.has-booking {
                position: relative;
            }

            .cal-day.has-booking::after {
                content: '';
                position: absolute;
                bottom: 4px;
                left: 50%;
                transform: translateX(-50%);
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: #0b0b45;
            }

            .cal-day.selected.has-booking::after {
                background: #fff;
            }
        </style>
    </head>

        <div class="schedule-page">

            <div class="schedule-left">
                <h1>Schedule</h1>
                <div class="schedule-room-list" id="scheduleRoomList">
                    <p class="no-bookings">Select a date to see bookings.</p>
                </div>
            </div>

            <div class="schedule-right">
                <div class="calendar">
                    <div class="calendar-header">
                        <button class="cal-nav" id="calPrev">&#8592;</button>
                        <span id="calMonthYear"></span>
                        <button class="cal-nav" id="calNext">&#8594;</button>
                    </div>
                    <div class="calendar-grid">
                        <div class="cal-days-header">
                            <div>S</div><div>M</div><div>T</div>
                            <div>W</div><div>T</div><div>F</div><div>S</div>
                        </div>
                        <div class="cal-days" id="calDays"></div>
                    </div>
                </div>
            </div>
        </div>

        <script src="./base.js"></script>
        <script>

            if (sessionStorage.getItem('uow_darkmode') === 'true') {
                document.documentElement.classList.add('dark-mode');
            }
            const rooms = JSON.parse(localStorage.getItem('uow_rooms') || '[]');

            const MONTHS = ['January','February','March','April','May','June',
                            'July','August','September','October','November','December'];

            const today = new Date();
            let viewYear  = today.getFullYear();
            let viewMonth = today.getMonth();
            let selectedDateStr = null;

            function getBookedDates() {
                return new Set(rooms.map(r => r.date));
            }

            function formatDateStr(year, month, day) {
                return `${day} ${MONTHS[month]} ${year}`;
            }

            function renderCalendar() {
                document.getElementById('calMonthYear').textContent =
                    `${MONTHS[viewMonth]} ${viewYear}`;

                const firstDay = new Date(viewYear, viewMonth, 1).getDay(); // 0=Sun
                const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
                const bookedDates = getBookedDates();

                const container = document.getElementById('calDays');
                container.innerHTML = '';

                for (let i = 0; i < firstDay; i++) {
                    const empty = document.createElement('div');
                    empty.className = 'cal-day empty';
                    container.appendChild(empty);
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    const cell = document.createElement('div');
                    cell.className = 'cal-day';
                    cell.textContent = d;

                    const dateStr = formatDateStr(viewYear, viewMonth, d);

                    if (d === today.getDate() && viewMonth === today.getMonth() && viewYear === today.getFullYear()) {
                        cell.classList.add('today');
                    }

                    if (dateStr === selectedDateStr) {
                        cell.classList.add('selected');
                    }

                    if (bookedDates.has(dateStr)) {
                        cell.classList.add('has-booking');
                    }

                    cell.addEventListener('click', () => {
                        selectedDateStr = dateStr;
                        renderCalendar();
                        renderRoomsForDate(dateStr);
                    });

                    container.appendChild(cell);
                }
            }

            function renderRoomsForDate(dateStr) {
                const list = document.getElementById('scheduleRoomList');
                const matched = rooms.filter(r => r.date === dateStr);

                if (matched.length === 0) {
                    list.innerHTML = `<p class="no-bookings">No bookings on ${dateStr}.</p>`;
                    return;
                }

                list.innerHTML = matched.map(room => {
                    const photoHTML = room.photo
                        ? `<img src="${room.photo}" alt="Room photo">`
                        : `<svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" fill="none" stroke="#aaa" stroke-width="1.2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;

                    return `
                        <div class="schedule-card">
                            <div class="schedule-card-photo">${photoHTML}</div>
                            <div class="schedule-card-info">
                                <h2>${room.roomType}</h2>
                                <p>Booked: ${room.time || '—'}</p>
                                <p>Block ${room.blk || '—'}, Room ${room.roomNo || '—'}</p>
                                <div class="schedule-card-actions">
                                    <button class="card-btn" onclick="window.location.href='./detail.html?id=${room.id}'">DETAIL</button>
                                </div>
                            </div>
                        </div>`;
                }).join('');
            }

            document.getElementById('calPrev').addEventListener('click', () => {
                viewMonth--;
                if (viewMonth < 0) { viewMonth = 11; viewYear--; }
                renderCalendar();
            });

            document.getElementById('calNext').addEventListener('click', () => {
                viewMonth++;
                if (viewMonth > 11) { viewMonth = 0; viewYear++; }
                renderCalendar();
            });

            // Initial render
            renderCalendar();
        </script>
