<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>History - UOW Room Booking System</title>
        <link rel="stylesheet" href="./loggedin.css">
        <style>
            .history-page {
                padding: 36px 48px;
            }

            .history-title {
                display: flex;
                align-items: center;
                gap: 12px;
                font-size: 2rem;
                font-weight: 800;
                color: #0b0b45;
                margin-bottom: 32px;
            }

            .history-title svg {
                flex-shrink: 0;
            }

            /* Room Card */
            .room-card {
                display: flex;
                align-items: center;
                border: 1px solid #ccc;
                border-radius: 6px;
                padding: 16px 20px;
                margin-bottom: 20px;
                gap: 20px;
                position: relative;
            }

            .room-card-photo {
                width: 120px;
                height: 100px;
                border: 1px solid #ccc;
                border-radius: 4px;
                flex-shrink: 0;
                overflow: hidden;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #fafafa;
            }

            .room-card-photo img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .room-card-photo svg {
                color: #aaa;
            }

            .room-card-info {
                flex: 1;
            }

            .room-card-info h2 {
                font-size: 1.4rem;
                font-weight: 800;
                color: #0b0b45;
                margin-bottom: 6px;
            }

            .room-card-info p {
                font-size: 0.95rem;
                color: #222;
                margin: 2px 0;
            }

            .room-card-capacity {
                position: absolute;
                top: 16px;
                right: 20px;
                display: flex;
                align-items: center;
                gap: 4px;
                font-size: 1rem;
                font-weight: 600;
                color: #0b0b45;
            }

            .room-card-actions {
                display: flex;
                gap: 10px;
                margin-top: 12px;
            }

            .card-btn {
                padding: 12px 24px;
                background-color: #0b0b45;
                color: #ffffff;
                font-size: 0.95rem;
                font-weight: 800;
                letter-spacing: 0.08em;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                transition: background-color 0.2s, transform 0.15s;
            }

            .card-btn:hover {
                background-color: #1a1a7a;
                transform: translateY(-1px);
            }

            .empty-history {
                text-align: center;
                color: #aaa;
                font-size: 1.1rem;
                margin-top: 80px;
            }

            /* Overlay & Panel */
            .menu-overlay {
                display: none; position: fixed; inset: 0;
                background-color: rgba(0,0,0,0.4);
                z-index: 98; opacity: 0; transition: opacity 0.3s ease;
            }
            .nav-panel {
                position: fixed; top: 0; left: 0;
                width: 280px; height: 100vh;
                background-color: #ffffff; z-index: 99;
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                display: flex; flex-direction: column;
                padding-top: 12px;
                box-shadow: 4px 0 20px rgba(0,0,0,0.1);
            }
            .nav-panel.open { transform: translateX(0); }
            .panel-close { margin: 8px 0 16px 16px; align-self: flex-start; }
            .panel-nav { display: flex; flex-direction: column; }
            .panel-item {
                display: flex; align-items: center; gap: 16px;
                padding: 18px 24px; font-size: 1rem; font-weight: 500;
                color: #0b0b45; text-decoration: none;
                border-bottom: 1px solid #ececec;
                transition: background-color 0.15s;
            }
            .panel-item:hover { background-color: #f4f4f8; }
            .panel-item svg { flex-shrink: 0; color: #0b0b45; }
        </style>
    </head>
    <body>
        <div class="menu-overlay" id="menuOverlay"></div>
        <div class="nav-panel" id="navPanel">
            <button class="nav-hamburger panel-close" id="panelClose" aria-label="Close menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="panel-nav">
                <a href="./profile.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>Profile
                </a>
                <a href="./history.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>History
                </a>
                <a href="./settings.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>Setting
                </a>
                <a href="./qa.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Q & A
                </a>
                <a href="./contact.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.4 2 2 0 0 1 3.6 1.22h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L7.91 8.8a16 16 0 0 0 6 6l.92-.92a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>Contact Us
                </a>
                <a href="./feedback.html" class="panel-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>Feedback
                </a>
            </nav>
        </div>

        <header class="site-header">
            <a href="./staff-dashboard.html" class="site-logo-link">
                <img src="./assets/uowlogo.svg" alt="University of Wollongong Logo" width="48" height="48"></a>
                <span class="site-title">UOW</span>
            <div class="header-icons">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </div>
        </header>

        <div class="header-divider"></div>
        <nav class="nav-bar">
            <button class="nav-hamburger" id="menuHamburger" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>
        </nav>

        <main>
            <div class="history-page">
                <h1 class="history-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" fill="none" stroke="#0b0b45" stroke-width="2" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
                    History
                </h1>

                <div id="historyList"></div>
            </div>
        </main>

        <script src="./base.js"></script>
        <script>
            const historyList = document.getElementById('historyList');
            const rooms = JSON.parse(localStorage.getItem('uow_rooms') || '[]');

            if (rooms.length === 0) {
                historyList.innerHTML = `<p class="empty-history">No rooms created yet.</p>`;
            } else {
                rooms.forEach(room => {
                const photoHTML = room.photo
                    ? `<img src="${room.photo}" alt="Room photo">`
                    : `<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="none" stroke="#aaa" stroke-width="1.2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;

                const roomDate = new Date(room.date);  
                const today    = new Date();
                today.setHours(0, 0, 0, 0);           
                const isFuture = roomDate >= today;


                const editBtn = isFuture
                    ? `<button class="card-btn" onclick="editRoom(${room.id})">EDIT</button>`
                    : '';

                historyList.innerHTML += `
                    <div class="room-card">
                        <div class="room-card-photo">${photoHTML}</div>
                        <div class="room-card-info">
                            <h2>${room.roomType}</h2>
                            <p>Date: ${room.date}</p>
                            <p>Time: ${room.time}</p>
                            <p>Price: S$ ${parseFloat(room.price || 0).toFixed(2)}</p>
                            <div class="room-card-actions">
                                ${editBtn}
                                <button class="card-btn" onclick="detailRoom(${room.id})">DETAIL</button>
                            </div>
                        </div>
                        <div class="room-card-capacity">
                            ${room.capacity}
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg>
                        </div>
                    </div>`;
                });
            }

            function editRoom(id) {
                window.location.href = `./edit.html?id=${id}`;
            }

            function detailRoom(id) {
                window.location.href = `./detail.html?id=${id}`;
            }
            if (sessionStorage.getItem('uow_darkmode') === 'true') {
        document.documentElement.classList.add('dark-mode');
        }
        </script>
    </body>
</html>
