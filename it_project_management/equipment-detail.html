<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Equipment Detail - UOW Room Booking System</title>
        <link rel="stylesheet" href="./loggedin.css">
        <script>
            if (sessionStorage.getItem('uow_darkmode') === 'true') {
                document.documentElement.classList.add('dark-mode');
            }
        </script>
        <style>
            .equip-detail-page {
                padding: 36px 48px;
                max-width: 860px;
            }

            .back-btn {
                display: flex;
                align-items: center;
                gap: 6px;
                background: none;
                border: none;
                font-size: 1rem;
                color: #333;
                cursor: pointer;
                margin-bottom: 32px;
                padding: 0;
            }
            .back-btn:hover { color: #0b0b45; }

            .equip-card {
                display: flex;
                align-items: flex-start;
                gap: 36px;
                border: 1.5px solid #ccc;
                border-radius: 8px;
                padding: 32px 36px;
                background: #fff;
                max-width: 620px;
                position: relative;
            }

            .equip-icon {
                flex-shrink: 0;
                width: 100px;
                color: #0b0b45;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .equip-icon svg {
                width: 90px;
                height: 90px;
            }

            .equip-info {
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex: 1;
            }

            .equip-name {
                font-size: 1.25rem;
                font-weight: 800;
                color: #111;
                margin-bottom: 4px;
            }

            .equip-row {
                font-size: 0.97rem;
                color: #111;
            }

            .equip-price-row {
                display: flex;
                align-items: center;
                gap: 0;
                font-size: 0.97rem;
                color: #111;
            }

            .equip-price-label {
                min-width: 60px;
                font-weight: 400;
            }

            .equip-price-colon {
                margin-right: 10px;
            }

            .equip-price-value {
                font-weight: 400;
            }

            .equip-note {
                font-size: 0.88rem;
                color: #444;
                margin-top: 6px;
                max-width: 300px;
                line-height: 1.5;
            }

            .book-action {
                display: flex;
                justify-content: flex-end;
                margin-top: 6px;
            }

            .book-btn {
                background: #0b0b45;
                color: #fff;
                border: none;
                border-radius: 8px;
                padding: 12px 40px;
                font-size: 1rem;
                font-weight: 800;
                letter-spacing: 0.08em;
                cursor: pointer;
                transition: background 0.15s;
            }
            .book-btn:hover { background: #1a1a6e; }

            /* Toast */
            .toast {
                position: fixed;
                bottom: 32px;
                left: 50%;
                transform: translateX(-50%) translateY(80px);
                background: #0b0b45;
                color: #fff;
                padding: 14px 28px;
                border-radius: 8px;
                font-size: 0.95rem;
                font-weight: 600;
                opacity: 0;
                transition: all 0.3s ease;
                z-index: 999;
                white-space: nowrap;
            }
            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            /* Dark mode */
            .dark-mode .back-btn { color: #aaa; }
            .dark-mode .back-btn:hover { color: #e0e0e0; }
            .dark-mode .equip-card { background: #1e1e2e; border-color: #444; }
            .dark-mode .equip-name,
            .dark-mode .equip-row,
            .dark-mode .equip-price-row { color: #e0e0e0; }
            .dark-mode .equip-note { color: #aaa; }
            .dark-mode .equip-icon { color: #a0b4ff; }
        </style>
    </head>
    <body>

                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" stroke="#0b0b45" stroke-width="1.8" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>

        <div class="header-divider"></div>

            <button class="nav-hamburger" id="menuHamburger" aria-label="Open menu">
                <span></span><span></span><span></span>
            </button>

        <main>
            <div class="equip-detail-page">
                <button class="back-btn" onclick="history.back()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                </button>

                <div class="equip-card" id="equipCard">
                    <p style="color:#999">Loading...</p>
                </div>
            </div>
        </main>

        <div class="toast" id="toast"></div>

        <script src="./base.js"></script>
        <script>
            // ── Equipment data — edit here to change items, stock, prices ──
            const EQUIPMENT = {
                keylock: {
                    name: 'Key Lock',
                    stock: 20,
                    price: 3.00,
                    icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <circle cx="8" cy="15" r="5"/>
                        <path d="M13 15h8M17 15v-3"/>
                        <circle cx="8" cy="15" r="2" fill="currentColor" stroke="none"/>
                    </svg>`
                },
                moreplug: {
                    name: 'More plug',
                    stock: 15,
                    price: 2.00,
                    icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <path d="M12 2v4M8 3v3M16 3v3"/>
                        <rect x="7" y="6" width="10" height="6" rx="1"/>
                        <path d="M12 12v4"/>
                        <circle cx="12" cy="18" r="2"/>
                    </svg>`
                },
                projector: {
                    name: 'Projector',
                    stock: 8,
                    price: 10.00,
                    icon: `<svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
                        <rect x="2" y="7" width="20" height="10" rx="2"/>
                        <circle cx="12" cy="12" r="2"/>
                        <path d="M6 12h.01M18 12h.01"/>
                        <path d="M12 17v4M9 21h6"/>
                    </svg>`
                }
            };

            const params = new URLSearchParams(window.location.search);
            const id     = params.get('id');
            const item   = EQUIPMENT[id];

            if (!item) {
                document.getElementById('equipCard').innerHTML =
                    '<p style="color:red">Equipment not found.</p>';
            } else {
                renderCard(item);
            }

            function renderCard(item) {
                document.getElementById('equipCard').innerHTML = `
                    <div class="equip-icon">${item.icon}</div>
                    <div class="equip-info">
                        <div class="equip-name">${item.name}</div>
                        <div class="equip-row">Item left: ${item.stock}</div>
                        <div class="equip-price-row">
                            <span class="equip-price-label">Price</span>
                            <span class="equip-price-colon">&nbsp;&nbsp;&nbsp;: S$</span>
                            <span class="equip-price-value">&nbsp;${item.price.toFixed(2)}</span>
                        </div>
                        <div class="equip-note">*You will get penalty if this equipment has any problem after use.</div>
                        <div class="book-action">
                            <button class="book-btn" onclick="bookEquipment()">BOOK</button>
                        </div>
                    </div>
                `;
            }

            function bookEquipment() {
                if (!item) return;

                const pending = {
                    id:       Date.now(),
                    type:     'equipment',
                    itemId:   id,
                    itemName: item.name,
                    price:    item.price,
                    bookedAt: new Date().toISOString(),
                    status:   'pending_payment'
                };

                localStorage.setItem('uow_pending_booking', JSON.stringify(pending));
                window.location.href = './payment.html';
            }

            function showToast(msg) {
                const t = document.getElementById('toast');
                t.textContent = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3500);
            }
        </script>
    </body>
