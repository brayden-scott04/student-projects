<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Staff Login - UOW Room Booking System</title>
        <link rel="stylesheet" href="./base.css">
        <style>
            .login-hero {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 75vh;
                gap: 8px;
                padding: 60px 24px;
                text-align: center;
            }

            .login-title {
                font-size: clamp(1.4em, 3vw, 2.5em);
                font-weight: 700;
                color: #0b0b45;
                letter-spacing: 0.03em;
                text-align: left;
                width: 100%;
                max-width: 500px;
                margin-bottom: 7px;
            }

            .login-form-card {
                display: flex;
                flex-direction: column;
                gap: 7px;
                background-color: #0b0b45;
                border: 1px solid #d0d0e0;
                border-radius: 30px;
                padding: 30px 20px;
                width: 500px;          /* ← same fixed width */
                box-sizing: border-box;
            }

            .login-group {
                display: flex;
                flex-direction: column;
                gap: 7px;
                width: 500px;
            }   

            .form-row {
                display: flex;
                align-items: center;
                gap: 16px;
            }

            .form-row label {
                font-size: 0.95em;
                font-weight: 600;
                color: #ffffff;
                letter-spacing: 0.03em;
                width: 90px;
                text-align: right;
                flex-shrink: 0;
            }

            .form-row input {
                padding: 5px 20px;
                border: 1px solid #b0b0c8;
                border-radius: 9999px;
                font-size: 0.95em;
                color: #0b0b45;
                background-color: #f7f7fb;
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            .form-row input:focus {
                border-color: #0b0b45;
                box-shadow: 0 0 0 3px rgba(11, 11, 69, 0.1);
            }

            .form-actions {
                display: flex;
                justify-content: flex-end;
                gap: 11px;
                width: 500px;    
                margin-top: 0;
                box-sizing: border-box;
            }

            .btn-clear,
            .btn-submit {
                padding: 10px 28px;
                border-radius: 9999px;
                font-size: 0.9em;
                font-weight: 650;
                letter-spacing: 0.06em;
                cursor: pointer;
                border: none;
                transition: background-color 0.2s, transform 0.15s;
            }

            .btn-clear {
                background-color: #0b0b45;
                color: #ffffff;
                border: 1px solid #c0c0d0;
            }

            .btn-clear:hover {
                background-color: #e0e0ee;
            }

            .btn-submit {
                background-color: #0b0b45;
                color: #ffffff;
            }

            .btn-submit:hover {
                background-color: #1a1a7a;
                transform: translateY(-2px);
            }

            .btn-submit:active {
                transform: translateY(0);
            }

            .input-wrapper {
                flex: 1;
                position: relative;
                display: flex;
                align-items: center;
            }

            .input-wrapper input {
                width: 100%;
                padding: 5px 44px 5px 20px;  /* ← keep left padding, add right padding for eye */
                border: 1px solid #b0b0c8;
                border-radius: 9999px;
                font-size: 0.95em;
                color: #0b0b45;
                background-color: #f7f7fb;
                outline: none;
                transition: border-color 0.2s, box-shadow 0.2s;
            }

            .input-wrapper input:focus {
                border-color: #0b0b45;
                box-shadow: 0 0 0 3px rgba(11, 11, 69, 0.1);
            }

            .eye-toggle {
                position: absolute;
                right: 16px;           
                background: none;
                border: none;
                cursor: pointer;
                color: #888;
                padding: 0;
                display: flex;
                align-items: center;
                transition: color 0.2s;
            }

            .eye-toggle:hover {
                color: #0b0b45;
            }
        </style>
    </head>
    
    <body>
        <header class="site-header">
            <img src="./assets/uowlogo.svg" alt="University of Wollongong Logo" width="48" height="48">
            <span class="site-title">UOW</span>
        </header>

        <div class="header-divider"></div>
        <nav class="nav-bar">
            <button class="nav-hamburger" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
        <main>
            <div class="login-hero">
                <div class="login-group">
                    <h1 class="login-title">Log in as STAFF</h1>

                    <div class="login-form-card">
                        <div class="form-row">
                            <label for="email">Email:</label>
                            <div class="input-wrapper">
                            <input type="email" id="email" placeholder="Enter your email">
                            </div>
                        </div>
                        <div class="form-row">
                            <label for="password">Password:</label>
                            <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Enter your password">
                            <button class="eye-toggle" type="button" onclick="togglePassword()" aria-label="Toggle password visibility">
                                <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                                <path d="M1 12C1 12 5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                                </svg>
                            </button>
                            </div>
                        </div>
                        <div class="form-row">
                            <label for="staffid">Staff ID:</label>
                            <div class="input-wrapper">
                            <input type="text" id="staffid" placeholder="Enter your Staff ID">
                            </div>
                        </div>
                    </div>    

                    <div class="form-actions">
                            <button class="btn-clear" onclick="clearForm()">Clear</button>
                            <button class="btn-submit" onclick="window.location.href='./staff-dashboard.html'">Log In</button>
                    </div>   
                </div>         
            </div>               
        </main>

        <script>
            function clearForm() {
                document.getElementById('email').value = '';
                document.getElementById('password').value = '';
                document.getElementById('staffid').value = '';
            }


            function togglePassword() {
                const input = document.getElementById('password');
                const icon = document.getElementById('eye-icon');

                if (input.type === 'password') {
                    input.type = 'text';
                    // Eye-off icon
                    icon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20C5 20 1 12 1 12a18.45 18.45 0 0 1 5.06-5.94" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    `;
                } else {
                    input.type = 'password';
                    // Eye icon 
                    icon.innerHTML = `
                        <path d="M1 12C1 12 5 4 12 4s11 8 11 8-4 8-11 8S1 12 1 12z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                    `;
                }
            }
        </script>
    </body>
</html>
